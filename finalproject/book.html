  <!-- Open Graph / Social Sharing -->

<body>
  <header>
    <div class="logo">RiverLine Fly Fishing</div>
    <button id="menuBtn" aria-label="Toggle Menu">&#9776;</button>
    <nav id="navMenu" aria-label="Main Navigation">
      <a href="index.html">Home</a>
      <a href="rivers.html">Rivers</a>
      <a href="book.html" class="active">Book</a>
    </nav>
  </header>

  <main>
    <section class="booking">
      <h1>Book a Guided Trip</h1>
      <p>Fill out the form below to reserve your guided fly fishing adventure.</p>

      <form action="thankyou.html" method="get" aria-label="Booking Form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required placeholder="Your full name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">

        <label for="river">Preferred River:</label>
        <input type="text" id="river" name="river" required placeholder="e.g., Bighorn River">

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>

        <input type="submit" value="Reserve Now">
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 RiverLine Fly Fishing</p>
    <nav aria-label="Footer Navigation">
      <a href="attributions.html">Attributions</a>

    </nav>
  </footer>
</body>
