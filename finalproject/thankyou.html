<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reservation Confirmed | RiverLine Fly Fishing</title>
  <meta name="description" content="Your guided fly fishing trip reservation has been confirmed. Thank you for booking with RiverLine Fly Fishing.">
  <meta name="author" content="Oksana Reid">

  <!-- Favicon -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/main.css">

  <!-- Open Graph -->
  <meta property="og:title" content="Reservation Confirmed | RiverLine Fly Fishing">
  <meta property="og:description" content="Your guided fly fishing trip reservation has been confirmed. Thank you for booking with RiverLine Fly Fishing.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://reidsana.github.io/wdd231/images/logo.svg">
  <meta property="og:url" content="https://reidsana.github.io/wdd231/thankyou.html">

  <!-- JavaScript to display submitted form data -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Guest";
      const email = params.get("email") || "Not provided";
      const river = params.get("river") || "Not specified";
      const date = params.get("date") || "Not selected";

      document.getElementById("output").innerHTML = `
        <p>Thank you, <strong>${name}</strong>!</p>
        <p>Email: <strong>${email}</strong></p>
        <p>River: <strong>${river}</strong></p>
        <p>Date: <strong>${date}</strong></p>
        <p>We look forward to seeing you on the river!</p>
      `;
    });
  </script>
</head>

<body>
  <header>
    <div class="logo">RiverLine Fly Fishing</div>
    <nav aria-label="Main Navigation">
      <a href="index.html">Home</a>
      <a href="rivers.html">Rivers</a>
      <a href="book.html">Book</a>
    </nav>
  </header>

  <main>
    <section class="confirmation">
      <h1>Reservation Confirmed</h1>
      <div id="output"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 RiverLine Fly Fishing</p>
    <nav aria-label="Footer Navigation">
      <a href="attributions.html">Attributions</a>
      <a href="https://your-video-link.com" target="_blank" rel="noopener">Video Demo</a>
    </nav>
  </footer>
</body>
</html>
